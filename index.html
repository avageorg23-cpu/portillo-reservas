<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motor de Reservas - Portillo Apartments</title>
  
  <!-- Flatpickr CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
    
    /* AGRANDAMOS EL CONTENEDOR A 650px PARA QUE QUEPAN LOS 2 MESES LADO A LADO */
    .booking-card { max-width: 650px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    
    h2 { text-align: center; color: #1a365d; margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9em; }
    select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1em; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .price-box { background-color: #e2e8f0; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: center; }
    .price-box .amount { font-size: 1.5em; font-weight: bold; color: #2b6cb0; }
    .btn-pay { width: 100%; background-color: #2b6cb0; color: white; border: none; padding: 12px; font-size: 1.1em; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; transition: background 0.2s; }
    .btn-pay:hover { background-color: #2c5282; }
    .btn-pay:disabled { background-color: #cbd5e0; cursor: not-allowed; }

    /* Estilo para ajustar el calendario doble en pantallas pequeñas */
    .flatpickr-calendar.hasWeeks, .flatpickr-calendar.hasTime {
      width: auto !important;
    }
  </style>
</head>
<body>

<div class="booking-card">
  <h2>Portillo Apartments</h2>
  <form id="reservaForm">
    
    <!-- PAGO / MONEDA -->
    <div class="form-group">
      <label for="moneda">Moneda de Pago:</label>
      <select id="moneda" required>
        <option value="ARS">Pesos Argentinos (ARS)</option>
        <option value="USD">Dólares (USD / PayPal)</option>
      </select>
    </div>

    <!-- DEPARTAMENTO -->
    <div class="form-group">
      <label for="bungalow">Departamento:</label>
      <select id="bungalow" required>
        <option value="">Cargando alojamientos...</option>
      </select>
    </div>

    <!-- PASAJEROS -->
    <div class="form-group">
      <label for="pasajeros">Pasajeros (Pax):</label>
      <select id="pasajeros" required disabled>
        <option value="">Seleccione Departamento</option>
      </select>
    </div>

    <!-- FECHAS (2 Meses visibles) -->
    <div class="form-group">
      <label for="fechas">Check-in / Check-out:</label>
      <input type="text" id="fechas" placeholder="Seleccione el rango de fechas" required disabled>
    </div>

    <!-- DATOS CLIENTE -->
    <div class="grid-2">
      <div class="form-group">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" required>
      </div>
      <div class="form-group">
        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" required>
      </div>
    </div>

    <div class="form-group">
      <label for="contacto">Contacto (WhatsApp):</label>
      <input type="tel" id="contacto" placeholder="+549..." required>
    </div>

    <!-- RESUMEN DE COTIZACIÓN -->
    <div class="price-box">
      <div>Total a Pagar (<span id="txtNoches">0</span> noches):</div>
      <div class="amount"><span id="txtSimbolo">$</span><span id="txtMonto">0</span> <span id="txtMoneda">ARS</span></div>
    </div>

    <button type="submit" id="btnPagar" class="btn-pay" disabled>PAGAR Y RESERVAR</button>
  </form>
</div>

<!-- Flatpickr JS -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>

<script>
  // Reemplaza con la URL de tu Web App desplegada en Google Apps Script
  const APPS_SCRIPT_URL = "REEMPLAZAR_CON_TU_URL_DE_APPS_SCRIPT";

  let preciosMatrix = {};
  let flatpickrInstancia = null;
  let checkinFinal = "";
  let checkoutFinal = "";
  let totalNoches = 0;
  let montoCalculado = 0;

  async function initMotor() {
    try {
      const resp = await fetch(`${APPS_SCRIPT_URL}?action=getPrecios`);
      preciosMatrix = await resp.json();

      const selectApart = document.getElementById("bungalow");
      selectApart.innerHTML = '<option value="">-- Seleccionar Apartamento --</option>';

      Object.keys(preciosMatrix).forEach(apart => {
        const opt = document.createElement("option");
        opt.value = apart;
        opt.textContent = apart;
        selectApart.appendChild(opt);
      });
    } catch (e) {
      alert("Error al conectar con la base de datos de tarifas.");
      console.error(e);
    }
  }

  document.getElementById("bungalow").addEventListener("change", async function() {
    const apart = this.value;
    const selectPax = document.getElementById("pasajeros");
    const inputFechas = document.getElementById("fechas");

    selectPax.innerHTML = "";
    resetearTotales();

    if (!apart || !preciosMatrix[apart]) {
      selectPax.disabled = true;
      inputFechas.disabled = true;
      return;
    }

    const opcionesPax = preciosMatrix[apart];
    selectPax.innerHTML = '<option value="">-- Cantidad de Personas --</option>';

    Object.keys(opcionesPax).forEach(pax => {
      const opt = document.createElement("option");
      opt.value = pax;
      opt.textContent = `${pax} Personas`;
      selectPax.appendChild(opt);
    });

    selectPax.disabled = false;
    await prepararCalendarioFechas(apart);
  });

  async function prepararCalendarioFechas(apart) {
    const inputFechas = document.getElementById("fechas");
    inputFechas.disabled = true;

    try {
      const resp = await fetch(`${APPS_SCRIPT_URL}?action=getDispo&room=${encodeURIComponent(apart)}`);
      const ocupadasData = await resp.json();
      
      const fechasBloqueadas = ocupadasData.slice(1).map(item => item[0]);

      if (flatpickrInstancia) flatpickrInstancia.destroy();

      flatpickrInstancia = flatpickr("#fechas", {
        mode: "range",
        locale: "es",
        dateFormat: "Y-m-d",
        showMonths: 2,         // Muestra 2 meses en simultáneo
        disableMobile: true,   // FORZA a mostrar la UI de 2 meses en móviles y pantallas táctiles
        minDate: "today",
        disable: fechasBloqueadas,
        onChange: function(selectedDates) {
          if (selectedDates.length === 2) {
            const checkin = selectedDates[0];
            const checkout = selectedDates[1];

            checkinFinal = flatpickr.formatDate(checkin, "d/m/Y");
            checkoutFinal = flatpickr.formatDate(checkout, "d/m/Y");

            const diff = Math.abs(checkout - checkin);
            totalNoches = Math.ceil(diff / (1000 * 60 * 60 * 24));

            recalcularTotales();
          } else {
            resetearTotales();
          }
        }
      });

      inputFechas.disabled = false;
    } catch (e) {
      console.error("Error al obtener disponibilidad:", e);
    }
  }

  document.getElementById("pasajeros").addEventListener("change", recalcularTotales);
  document.getElementById("moneda").addEventListener("change", function() {
    const monedaSel = this.value;
    document.getElementById("txtMoneda").textContent = monedaSel;
    document.getElementById("txtSimbolo").textContent = monedaSel === "ARS" ? "$" : "USD$ ";
    recalcularTotales();
  });

  function recalcularTotales() {
    const apart = document.getElementById("bungalow").value;
    const pax = document.getElementById("pasajeros").value;
    const btnPagar = document.getElementById("btnPagar");

    if (apart && pax && totalNoches > 0 && preciosMatrix[apart][pax]) {
      const precioNoche = preciosMatrix[apart][pax];
      montoCalculado = precioNoche * totalNoches;

      document.getElementById("txtNoches").textContent = totalNoches;
      document.getElementById("txtMonto").textContent = montoCalculado.toLocaleString("es-AR");
      btnPagar.disabled = false;
    } else {
      btnPagar.disabled = true;
    }
  }

  function resetearTotales() {
    totalNoches = 0;
    montoCalculado = 0;
    document.getElementById("txtNoches").textContent = "0";
    document.getElementById("txtMonto").textContent = "0";
    document.getElementById("btnPagar").disabled = true;
  }

  document.getElementById("reservaForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const btnPagar = document.getElementById("btnPagar");
    btnPagar.disabled = true;
    btnPagar.textContent = "Procesando...";

    const payload = {
      bungalow: document.getElementById("bungalow").value,
      pasajeros: document.getElementById("pasajeros").value,
      checkin: checkinFinal,
      checkout: checkoutFinal,
      noches: totalNoches,
      montoTotal: montoCalculado,
      moneda: document.getElementById("moneda").value,
      nombre: document.getElementById("nombre").value,
      apellido: document.getElementById("apellido").value,
      contacto: document.getElementById("contacto").value
    };

    try {
      const resp = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      const res = await resp.json();

      if (res.status === "success") {
        if (payload.moneda === "ARS" && res.init_point) {
          window.location.href = res.init_point;
        } else {
          alert("¡Reserva procesada con éxito!");
          location.reload();
        }
      } else {
        alert("Error: " + res.message);
        btnPagar.disabled = false;
        btnPagar.textContent = "PAGAR Y RESERVAR";
      }
    } catch (err) {
      alert("Error al comunicarse con el servidor.");
      console.error(err);
      btnPagar.disabled = false;
      btnPagar.textContent = "PAGAR Y RESERVAR";
    }
  });

  initMotor();
</script>

</body>
</html>
